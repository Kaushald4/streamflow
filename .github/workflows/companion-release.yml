name: Release Streamflow Companion

# Builds the local companion binary (companion/cli) for macOS/Windows/Linux
# and publishes it to a GitHub Release.
#
# Tag-driven on purpose. The matrix builds four operating systems, and on a
# branch push its only output would be an artifact nothing consumes, because
# the release job is tag-gated. Pushing a tag like `companion-v0.1.0` builds
# and publishes; a manual run (workflow_dispatch) verifies the builds without
# releasing, and costs nothing the rest of the time.
on:
  push:
    tags:
      - "companion-v*"
  workflow_dispatch: {}

# Read-only by default. Only the release job elevates, so a routine push to
# main can never write to the repository.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: streamflow-companion-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: streamflow-companion-macos-x64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: streamflow-companion-linux-x64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: streamflow-companion-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion -> target

      - name: Build companion
        working-directory: companion
        run: cargo build --release -p companion --target ${{ matrix.target }}

      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        working-directory: companion/target/${{ matrix.target }}/release
        run: tar -czf "${{ github.workspace }}/${{ matrix.asset }}" streamflow-companion

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: companion/target/${{ matrix.target }}/release
        run: Compress-Archive -Path streamflow-companion.exe -DestinationPath "${{ github.workspace }}/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/companion-v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
